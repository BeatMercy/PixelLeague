<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel League: Silverfield Outskirts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>
<button id="langToggle" type="button" aria-label="Switch language">中文</button>

<div id="hud" class="hidden">
  <div id="topbar">
    <span id="stageName"></span>
    <span id="waveInfo"></span>
    <span id="goldInfo"></span>
    <span id="killInfo"></span>
    <span id="timeInfo"></span>
  </div>
  <canvas id="minimap" width="140" height="74"></canvas>
  <div id="statsPanel"></div>
  <div id="extrasPanel"></div>
  <div id="bossBar" class="hidden"><div class="name"></div><div class="bar"><div class="fill"></div></div></div>
  <div id="banner"></div>
  <div id="bottom">
    <div id="portrait"><div id="heroIcon"></div><div id="lvl">1</div></div>
    <div id="center">
      <div id="skills"></div>
      <div class="bar" id="hpBar"><div class="shield"></div><div class="fill"></div><span></span></div>
      <div class="bar" id="mpBar"><div class="fill"></div><span></span></div>
      <div class="bar small" id="xpBar"><div class="fill"></div></div>
    </div>
    <div id="inventory"></div>
  </div>
  <div id="hint">Right-click: move / attack &nbsp; Q W E R: skills &nbsp; Shift+Q/W/E/R: level skill &nbsp; D: Flash &nbsp; F: Heal &nbsp; A+Click: attack-move &nbsp; S: stop &nbsp; Space: center &nbsp; Y: camera lock &nbsp; Esc: pause</div>
</div>

<div id="tooltip" class="hidden"></div>
<div id="screen" class="hidden"></div>

<script src="js/i18n.js"></script>
<script src="js/core.js"></script>
<script src="js/sprites.js"></script>
<script src="js/sprite_defs.js"></script>
<script src="js/props.js"></script>
<script src="js/map.js"></script>
<script src="js/fx.js"></script>
<script src="js/data_items.js"></script>
<script src="js/data_talents.js"></script>
<script src="js/data_enemies.js"></script>
<script src="js/entity.js"></script>
<script src="js/combat.js"></script>
<script src="js/hero_kestrel.js"></script>
<script src="js/hero_vela.js"></script>
<script src="js/hero_aldric.js"></script>
<script src="js/extras.js"></script>
<script src="js/player.js"></script>
<script src="js/player_update.js"></script>
<script src="js/enemy.js"></script>
<script src="js/boss.js"></script>
<script src="js/spawner.js"></script>
<script src="js/render.js"></script>
<script src="js/hud.js"></script>
<script src="js/ui.js"></script>
<script src="js/meta.js"></script>
<script src="js/main.js"></script>
</body>
</html>
